<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOR Compliance Matrix</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #root {
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: "JetBrains Mono", monospace;
        background: #0c0e14;
        color: #dde1ec;
        font-size: 13px;
      }
      :root {
        --amber: #f0a500;
        --amber-d: #c47f00;
        --amber-bg: rgba(240, 165, 0, 0.08);
        --amber-bg2: rgba(240, 165, 0, 0.14);
        --sur0: #0c0e14;
        --sur1: #13161f;
        --sur2: #1a1e2b;
        --sur3: #222636;
        --sur4: #2b3045;
        --bdr: rgba(240, 165, 0, 0.18);
        --bdr2: rgba(255, 255, 255, 0.07);
        --bdr3: rgba(255, 255, 255, 0.12);
        --txt: #dde1ec;
        --txt2: #9aa3be;
        --txt3: #5c6480;
        --comply: #22c55e;
        --comply-bg: rgba(34, 197, 94, 0.1);
        --comply-bdr: rgba(34, 197, 94, 0.35);
        --partial: #f0a500;
        --partial-bg: rgba(240, 165, 0, 0.1);
        --partial-bdr: rgba(240, 165, 0, 0.35);
        --notcomply: #ef4444;
        --notcomply-bg: rgba(239, 68, 68, 0.1);
        --notcomply-bdr: rgba(239, 68, 68, 0.35);
        --na: #5c6480;
        --na-bg: rgba(92, 100, 128, 0.1);
        --na-bdr: rgba(92, 100, 128, 0.3);
        --warn: #f59e0b;
        --warn-bg: rgba(245, 158, 11, 0.1);
        --info: #38bdf8;
        --info-bg: rgba(56, 189, 248, 0.08);
        --info-bdr: rgba(56, 189, 248, 0.25);
        --danger: #ef4444;
        --danger-bg: rgba(239, 68, 68, 0.08);
        --sb: 260px;
      }
      /* scrollbars */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: var(--sur1);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--sur4);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--amber-d);
      }

      /* layout */
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      .topbar {
        height: 50px;
        flex-shrink: 0;
        background: var(--sur1);
        border-bottom: 1px solid var(--bdr);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .brand-pulse {
        width: 7px;
        height: 7px;
        background: var(--amber);
        border-radius: 50%;
        animation: pulse 2.4s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          box-shadow: 0 0 0 0 rgba(240, 165, 0, 0.5);
        }
        60% {
          opacity: 0.5;
          box-shadow: 0 0 0 4px rgba(240, 165, 0, 0);
        }
      }
      .brand-name {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--amber);
      }
      .brand-sep {
        width: 1px;
        height: 18px;
        background: var(--bdr2);
        margin: 0 4px;
      }
      .proj-input {
        font-family: inherit;
        font-size: 12px;
        color: var(--txt);
        background: var(--sur2);
        border: 1px solid var(--bdr2);
        border-radius: 4px;
        padding: 5px 10px;
        outline: none;
        width: 200px;
        transition: border-color 0.15s;
      }
      .proj-input:focus {
        border-color: var(--amber);
      }
      .proj-input::placeholder {
        color: var(--txt3);
      }
      .topbar-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .model-sel {
        font-family: inherit;
        font-size: 11px;
        font-weight: 600;
        background: var(--sur2);
        border: 1px solid var(--bdr2);
        border-radius: 4px;
        color: var(--txt2);
        padding: 5px 8px;
        outline: none;
        cursor: pointer;
        transition: border-color 0.15s;
      }
      .model-sel:focus {
        border-color: var(--amber);
      }
      .model-sel option {
        background: var(--sur1);
      }

      /* buttons */
      .btn {
        font-family: inherit;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        padding: 6px 14px;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid;
        transition: all 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .btn-amber {
        background: var(--amber);
        color: #0c0e14;
        border-color: var(--amber);
      }
      .btn-amber:hover {
        background: #fbbf24;
        border-color: #fbbf24;
      }
      .btn-amber:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .btn-ghost {
        background: transparent;
        color: var(--txt2);
        border-color: var(--bdr2);
      }
      .btn-ghost:hover {
        border-color: var(--amber);
        color: var(--amber);
      }
      .btn-ghost:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .btn-danger {
        background: transparent;
        color: var(--notcomply);
        border-color: rgba(239, 68, 68, 0.3);
      }
      .btn-danger:hover {
        background: var(--notcomply-bg);
      }
      .btn-sm {
        padding: 4px 10px;
        font-size: 10px;
      }
      .btn-xs {
        padding: 2px 7px;
        font-size: 10px;
      }

      /* body */
      .body {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* sidebar */
      .sidebar {
        width: var(--sb);
        flex-shrink: 0;
        background: var(--sur1);
        border-right: 1px solid var(--bdr2);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .sb-sec {
        padding: 12px 14px;
        border-bottom: 1px solid var(--bdr2);
        flex-shrink: 0;
      }
      .sb-label {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--amber);
        margin-bottom: 8px;
      }
      .sb-hint {
        font-size: 10px;
        color: var(--txt3);
        line-height: 1.55;
        margin-bottom: 8px;
      }

      /* upload zone */
      .upload-zone {
        border: 1px dashed var(--bdr);
        border-radius: 5px;
        padding: 18px 12px;
        text-align: center;
        cursor: pointer;
        background: var(--amber-bg);
        transition: all 0.2s;
      }
      .upload-zone:hover,
      .upload-zone.drag {
        border-color: var(--amber);
        background: var(--amber-bg2);
      }
      .upload-ico {
        font-size: 22px;
        margin-bottom: 5px;
      }
      .upload-txt {
        font-size: 10px;
        color: var(--txt2);
        line-height: 1.6;
      }
      .upload-txt strong {
        color: var(--amber);
      }
      .file-input {
        display: none;
      }

      /* file badge */
      .file-badge {
        background: var(--sur2);
        border: 1px solid var(--bdr);
        border-radius: 4px;
        padding: 7px 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .file-ico {
        font-size: 14px;
        flex-shrink: 0;
      }
      .file-name {
        font-size: 10px;
        color: var(--txt);
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .file-clear {
        background: none;
        border: none;
        color: var(--txt3);
        cursor: pointer;
        font-size: 16px;
        flex-shrink: 0;
        line-height: 1;
      }
      .file-clear:hover {
        color: var(--notcomply);
      }
      .extract-btn {
        width: 100%;
        justify-content: center;
        margin-top: 8px;
      }

      /* scanned key panel */
      .key-panel {
        background: var(--info-bg);
        border: 1px solid var(--info-bdr);
        border-radius: 5px;
        padding: 10px 12px;
      }
      .key-panel-title {
        font-size: 10px;
        font-weight: 600;
        color: var(--info);
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .key-input {
        font-family: inherit;
        font-size: 10px;
        background: var(--sur2);
        border: 1px solid var(--bdr2);
        border-radius: 3px;
        padding: 5px 8px;
        color: var(--txt);
        outline: none;
        width: 100%;
        margin-bottom: 5px;
        transition: border-color 0.15s;
      }
      .key-input:focus {
        border-color: var(--info);
      }
      .key-input::placeholder {
        color: var(--txt3);
      }
      .key-row {
        display: flex;
        gap: 5px;
      }

      /* library */
      .lib-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 10px 14px;
      }
      .lib-item {
        background: var(--sur2);
        border: 1px solid var(--bdr2);
        border-radius: 4px;
        padding: 7px 9px;
        margin-bottom: 5px;
        cursor: pointer;
        transition: all 0.15s;
        position: relative;
      }
      .lib-item:hover {
        border-color: var(--amber);
        background: var(--amber-bg);
      }
      .lib-item-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 4px;
      }
      .lib-item-label {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--amber);
        margin-bottom: 3px;
        flex: 1;
      }
      .lib-item-text {
        font-size: 10px;
        color: var(--txt2);
        line-height: 1.5;
        font-family: "Sarabun", sans-serif;
      }
      .lib-remove {
        background: none;
        border: none;
        color: var(--txt3);
        cursor: pointer;
        font-size: 13px;
        padding: 0;
        flex-shrink: 0;
      }
      .lib-remove:hover {
        color: var(--notcomply);
      }
      .lib-status-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        flex-shrink: 0;
        margin-top: 3px;
      }
      .lib-add-btn {
        width: 100%;
        font-family: inherit;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        background: transparent;
        border: 1px dashed var(--bdr2);
        border-radius: 3px;
        color: var(--txt3);
        padding: 6px;
        cursor: pointer;
        margin-top: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        transition: all 0.15s;
      }
      .lib-add-btn:hover {
        border-color: var(--amber);
        color: var(--amber);
      }
      .lib-add-form {
        background: var(--sur2);
        border: 1px solid var(--bdr);
        border-radius: 4px;
        padding: 9px;
        margin-top: 4px;
      }
      .lib-add-label {
        font-size: 9px;
        color: var(--txt3);
        margin-bottom: 3px;
        display: block;
      }
      .lib-add-input {
        font-family: inherit;
        font-size: 11px;
        background: var(--sur3);
        border: 1px solid var(--bdr2);
        border-radius: 3px;
        padding: 4px 7px;
        color: var(--txt);
        outline: none;
        width: 100%;
        margin-bottom: 5px;
      }
      .lib-add-input:focus {
        border-color: var(--amber);
      }
      .lib-add-input::placeholder {
        color: var(--txt3);
      }
      .lib-add-sel {
        font-family: inherit;
        font-size: 11px;
        background: var(--sur3);
        border: 1px solid var(--bdr2);
        border-radius: 3px;
        padding: 4px 7px;
        color: var(--txt2);
        outline: none;
        width: 100%;
        margin-bottom: 5px;
      }
      .lib-add-sel option {
        background: var(--sur1);
      }
      .lib-add-btns {
        display: flex;
        gap: 5px;
      }

      /* content */
      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      /* toolbar */
      .toolbar {
        padding: 8px 14px;
        background: var(--sur1);
        border-bottom: 1px solid var(--bdr2);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        flex-shrink: 0;
        min-height: 44px;
      }
      .stats {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .stat {
        font-size: 10px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .stat-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .stat-val {
        color: var(--txt);
        font-weight: 600;
      }
      .stat-lbl {
        color: var(--txt3);
      }
      .toolbar-sep {
        width: 1px;
        height: 16px;
        background: var(--bdr2);
      }
      .filters {
        display: flex;
        gap: 3px;
      }
      .f-btn {
        font-family: inherit;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 3px 9px;
        border-radius: 3px;
        cursor: pointer;
        border: 1px solid var(--bdr2);
        background: transparent;
        color: var(--txt3);
        transition: all 0.15s;
      }
      .f-all.on {
        border-color: var(--amber);
        color: var(--amber);
        background: var(--amber-bg);
      }
      .f-comply.on {
        border-color: var(--comply-bdr);
        color: var(--comply);
        background: var(--comply-bg);
      }
      .f-partial.on {
        border-color: var(--partial-bdr);
        color: var(--partial);
        background: var(--partial-bg);
      }
      .f-notcomply.on {
        border-color: var(--notcomply-bdr);
        color: var(--notcomply);
        background: var(--notcomply-bg);
      }
      .f-na.on {
        border-color: var(--na-bdr);
        color: var(--na);
        background: var(--na-bg);
      }
      .toggles {
        display: flex;
        gap: 10px;
        margin-left: auto;
      }
      .toggle-label {
        font-size: 10px;
        color: var(--txt2);
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        user-select: none;
      }
      .toggle-label input {
        accent-color: var(--amber);
        cursor: pointer;
      }

      /* progress bar */
      .progress {
        height: 2px;
        background: var(--sur2);
        flex-shrink: 0;
      }
      .progress-fill {
        height: 100%;
        background: var(--amber);
        animation: prog 1.8s ease-in-out infinite;
        width: 35%;
      }
      @keyframes prog {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }

      /* table area */
      .table-area {
        flex: 1;
        overflow: auto;
        position: relative;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      thead {
        position: sticky;
        top: 0;
        z-index: 10;
      }
      thead tr {
        background: var(--sur2);
      }
      th {
        padding: 8px 10px;
        text-align: left;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--amber);
        border-bottom: 1px solid var(--bdr);
        white-space: nowrap;
      }
      td {
        padding: 0;
        border-bottom: 1px solid var(--bdr2);
        vertical-align: top;
      }
      tr:hover td {
        background: rgba(240, 165, 0, 0.025);
      }
      tr.sel-row td {
        background: rgba(240, 165, 0, 0.06);
      }
      .td-p {
        padding: 7px 10px;
      }

      /* column widths */
      .c-no {
        width: 42px;
      }
      .c-ref {
        width: 80px;
      }
      .c-req {
        min-width: 220px;
      }
      .c-tr {
        min-width: 180px;
      }
      .c-cat {
        width: 110px;
      }
      .c-sts {
        width: 120px;
      }
      .c-rem {
        min-width: 180px;
      }
      .c-del {
        width: 38px;
      }

      /* cell inputs */
      .cell-in {
        font-family: "Sarabun", sans-serif;
        font-size: 13px;
        color: var(--txt);
        background: transparent;
        border: none;
        outline: none;
        width: 100%;
        resize: none;
        line-height: 1.75;
        min-height: 38px;
      }
      .cell-in:focus {
        background: rgba(255, 255, 255, 0.025);
        border-radius: 3px;
      }
      .cell-in::placeholder {
        color: var(--txt3);
        font-size: 11px;
      }
      .ref-in {
        font-family: inherit;
        font-size: 11px;
        color: var(--txt2);
        background: transparent;
        border: none;
        outline: none;
        width: 100%;
      }
      .ref-in:focus {
        color: var(--txt);
      }
      .ref-in::placeholder {
        color: var(--txt3);
      }
      .cat-sel {
        font-family: inherit;
        font-size: 10px;
        background: var(--sur2);
        border: 1px solid var(--bdr2);
        border-radius: 3px;
        color: var(--txt2);
        padding: 3px 5px;
        outline: none;
        cursor: pointer;
        width: 100%;
      }
      .cat-sel option {
        background: var(--sur1);
      }
      .sts-sel {
        font-family: inherit;
        font-size: 11px;
        font-weight: 600;
        border-radius: 4px;
        padding: 4px 6px;
        outline: none;
        cursor: pointer;
        width: 100%;
        border: 1px solid;
      }
      .sts-comply {
        color: var(--comply);
        background: var(--comply-bg);
        border-color: var(--comply-bdr);
      }
      .sts-partial {
        color: var(--partial);
        background: var(--partial-bg);
        border-color: var(--partial-bdr);
      }
      .sts-notcomply {
        color: var(--notcomply);
        background: var(--notcomply-bg);
        border-color: var(--notcomply-bdr);
      }
      .sts-na {
        color: var(--na);
        background: var(--na-bg);
        border-color: var(--na-bdr);
      }
      .sts-sel option {
        background: var(--sur1);
        color: var(--txt);
      }
      .warn-flag {
        font-size: 9px;
        color: var(--warn);
        display: flex;
        align-items: center;
        gap: 3px;
        margin-top: 2px;
      }
      .row-del {
        background: none;
        border: none;
        color: var(--txt3);
        cursor: pointer;
        font-size: 15px;
        padding: 2px 5px;
        border-radius: 3px;
      }
      .row-del:hover {
        color: var(--notcomply);
        background: var(--notcomply-bg);
      }
      .no-txt {
        font-size: 11px;
        color: var(--txt3);
        text-align: center;
        padding: 4px 0;
        user-select: none;
      }

      /* empty state */
      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        padding: 60px 24px;
        text-align: center;
      }
      .empty-ico {
        font-size: 40px;
        opacity: 0.2;
        margin-bottom: 14px;
      }
      .empty-title {
        font-size: 13px;
        color: var(--txt2);
        margin-bottom: 6px;
      }
      .empty-sub {
        font-size: 11px;
        color: var(--txt3);
        line-height: 1.7;
      }

      /* loading overlay */
      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(12, 14, 20, 0.88);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid var(--bdr2);
        border-top-color: var(--amber);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        margin-bottom: 12px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .ov-msg {
        font-size: 11px;
        color: var(--txt2);
        letter-spacing: 0.04em;
      }
      .ov-sub {
        font-size: 10px;
        color: var(--txt3);
        margin-top: 3px;
      }
      .ov-prog-wrap {
        width: 160px;
        height: 2px;
        background: var(--sur3);
        border-radius: 1px;
        margin-top: 10px;
        overflow: hidden;
      }

      function isLikelyTranslated(txt) {
        return !/[\u0E00-\u0E7F]/.test(txt) && txt.trim().length > 0;
      }

      async function detectPDFType(file) {
        const ab = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
        const page = await pdf.getPage(1);
        const tc = await page.getTextContent();
        const text = tc.items.map((i) => i.str).join("");
        return text.trim().length > 50 ? "digital" : "scanned";
      }

      async function rasterizePage(pdf, pageNum, scale = 2) {
        const page = await pdf.getPage(pageNum);
        const vp = page.getViewport({ scale });
        const canvas = document.createElement("canvas");
        canvas.width = vp.width;
        canvas.height = vp.height;
        const ctx = canvas.getContext("2d");
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        return canvas.toDataURL("image/png").split(",")[1];
      }

      async function callDocumentAI(
        pageB64,
        apiKey,
        projectId,
        location,
        processorId,
      ) {
        const url = `https://documentai.googleapis.com/v1/projects/${projectId}/locations/${location}/processors/${processorId}:process`;
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${apiKey}`,
          },
          body: JSON.stringify({
            rawDocument: { content: pageB64, mimeType: "image/png" },
          }),
        });
        if (!res.ok) {
          const e = await res.json().catch(() => ({}));
          throw new Error(e?.error?.message || `Google API ${res.status}`);
        }
        const data = await res.json();
        return data?.document?.text || "";
      }

      async function ocrPDFGoogle(
        file,
        apiKey,
        projectId,
        location,
        processorId,
        onProgress,
      ) {
        const ab = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
        const numPages = pdf.numPages;
        const texts = [];
        for (let p = 1; p <= numPages; p++) {
          onProgress && onProgress(p, numPages);
          const b64 = await rasterizePage(pdf, p);
          const txt = await callDocumentAI(
            b64,
            apiKey,
            projectId,
            location,
            processorId,
          );
          texts.push(txt);
        }
        return texts.join("\n\n--- PAGE BREAK ---\n\n");
      }

      async function ocrPDFClaude(file, model, onProgress) {
        const ab = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
        const numPages = pdf.numPages;
        const texts = [];
        for (let p = 1; p <= numPages; p++) {
          onProgress && onProgress(p, numPages);
          const b64 = await rasterizePage(pdf, p);
          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model,
              max_tokens: 2000,
              messages: [
                {
                  role: "user",
                  content: [
                    {
                      type: "image",
                      source: {
                        type: "base64",
                        media_type: "image/png",
                        data: b64,
                      },
                    },
                    {
                      type: "text",
                      text:
                        "This is page " +
                        p +
                        " of a scanned Thai TOR (Terms of Reference) document. Extract ALL text from this page exactly as written — verbatim, including Thai text. Preserve paragraph structure and numbering. Return only the extracted text, no commentary.",
                    },
                  ],
                },
              ],
            }),
          });
          if (!res.ok) {
            const e = await res.json().catch(() => ({}));
            throw new Error(
              e?.error?.message || `Claude Vision API ${res.status}`,
            );
          }
          const data = await res.json();
          const txt = data.content?.find((b) => b.type === "text")?.text || "";
          texts.push(txt);
        }
        return texts.join("\n\n--- PAGE BREAK ---\n\n");
      }

      function buildSystemPrompt(withTranslation, isOCR) {
        let sp = `You are an expert automation and IIoT engineer reading a Terms of Reference (TOR) document, which may be in Thai, English, or mixed Thai/English.

CRITICAL RULE — VERBATIM COPY:
The "requirement" field must be copied CHARACTER FOR CHARACTER exactly as it appears in the source document.
- Thai text → copy exactly in Thai (ภาษาไทย)
- English text → copy exactly in English
- Mixed Thai/English → copy exactly as mixed
- Do NOT translate Thai to English in the requirement field
- Do NOT paraphrase, summarize, or reword
- Do NOT clean up grammar or fix spelling
- Copy every word, number, unit, and symbol exactly

Return ONLY a valid JSON array. No markdown fences. No backticks. No preamble. No explanation.
If you add ANY text outside the JSON array the parser will fail.

Each object must have exactly these keys:
{"ref":"clause number from document e.g. '2.1' or 'ข้อ 5'. If none, use 'CL-001','CL-002' etc.","requirement":"VERBATIM text copied exactly from TOR — Thai or English as written","category":"exactly one of: General|Mechanical|Electrical|Control/PLC|IIoT/SCADA|BMS|Network|Safety|Documentation|Testing|Other"}

CORRECT: {"ref":"3.2","requirement":"ระบบควบคุมจะต้องใช้ PLC ยี่ห้อ Siemens รุ่น S7-1500 เท่านั้น","category":"Control/PLC"}
WRONG:   {"ref":"3.2","requirement":"The control system must use Siemens S7-1500 PLC only","category":"Control/PLC"} ← translated, not verbatim

Extract ALL of: technical specs, performance requirements, brand/model requirements, material/standard requirements, testing/commissioning requirements, documentation requirements, warranty/maintenance requirements, safety requirements.`;

        if (withTranslation) {
          sp += `\n\nADDITIONAL: Also add a "translation" field with an English translation of each requirement.
The "requirement" field stays VERBATIM original language. The "translation" field is your English translation.
Extended format: {"ref":"...","requirement":"VERBATIM Thai","translation":"English translation","category":"..."}`;
        }

        if (isOCR) {
          sp += `\n\nNOTE: The input text was extracted by OCR from a scanned document. There may be minor OCR errors (broken words, wrong characters). Identify the intended meaning from context, but still copy the text verbatim including OCR artifacts — do not silently fix them. The engineer will review and correct.`;
        }

        return sp;
      }

      async function extractRequirements(
        file,
        model,
        withTranslation,
        pdfType,
        ocrText,
      ) {
        const sp = buildSystemPrompt(withTranslation, pdfType === "scanned");

        let messages;
        if (pdfType === "digital") {
          const ab = await file.arrayBuffer();
          const b64 = btoa(String.fromCharCode(...new Uint8Array(ab)));
          messages = [
            {
              role: "user",
              content: [
                {
                  type: "document",
                  source: {
                    type: "base64",
                    media_type: "application/pdf",
                    data: b64,
                  },
                },
                {
                  type: "text",
                  text: "Extract all requirements from this TOR document as a JSON array. Return only the JSON array, nothing else.",
                },
              ],
            },
          ];
        } else {
          messages = [
            {
              role: "user",
              content: `The following text was extracted via OCR from a scanned TOR document.\n\n${ocrText}\n\nExtract all requirements as a JSON array. Return only the JSON array, nothing else.`,
            },
          ];
        }

        const res = await fetch("/api/claude", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model,
            max_tokens: 4000,
            system: sp,
            messages,
          }),
        });
        if (!res.ok) {
          const e = await res.json().catch(() => ({}));
          throw new Error(e?.error?.message || `Claude API ${res.status}`);
        }
        const data = await res.json();
        const raw = data.content?.find((b) => b.type === "text")?.text || "[]";
        const clean = raw.replace(/```json|```/g, "").trim();
        let parsed;
        try {
          parsed = JSON.parse(clean);
        } catch {
          throw new Error(
            "Could not parse extraction result. Try the Opus model or check if the PDF has readable content.",
          );
        }
        if (!Array.isArray(parsed) || parsed.length === 0)
          throw new Error(
            "No requirements found. PDF may have no structured text layer.",
          );
        return parsed;
      }

      function buildGeminiPrompt(withTranslation, isOCR) {
        let p = `You are an expert automation and IIoT engineer reading a Terms of Reference (TOR) document in Thai, English, or mixed.

CRITICAL RULE — VERBATIM COPY:
The "requirement" field must be copied CHARACTER FOR CHARACTER exactly as it appears.
- Thai text → copy exactly in Thai
- English text → copy exactly in English
- Mixed → copy exactly as mixed
- Do NOT translate, paraphrase, summarize, or reword
- Copy every word, number, unit, and symbol exactly

Return ONLY a valid JSON array. No markdown. No backticks. No explanation.

Each object:
{"ref":"clause number e.g. '2.1' or 'ข้อ 5', else 'CL-001'","requirement":"VERBATIM text from TOR","category":"one of: General|Mechanical|Electrical|Control/PLC|IIoT/SCADA|BMS|Network|Safety|Documentation|Testing|Other"}

CORRECT: {"ref":"3.2","requirement":"ระบบควบคุมจะต้องใช้ PLC ยี่ห้อ Siemens รุ่น S7-1500 เท่านั้น","category":"Control/PLC"}
WRONG:   {"ref":"3.2","requirement":"The control system must use Siemens S7-1500 PLC only","category":"Control/PLC"}

Extract ALL: technical specs, performance, brand/model, material/standard, testing, documentation, warranty, safety requirements.`;

        if (withTranslation) {
          p += `\n\nAlso add "translation" field with English translation. "requirement" stays VERBATIM original. Format: {"ref":"...","requirement":"VERBATIM Thai","translation":"English translation","category":"..."}`;
        }
        if (isOCR) {
          p += `\n\nInput is OCR text — may have minor errors. Copy verbatim including artifacts. Do not silently fix OCR errors.`;
        }
        return p;
      }

      async function extractWithGemini(
        file,
        geminiKey,
        geminiModel,
        withTranslation,
        pdfType,
        ocrText,
      ) {
        const prompt = buildGeminiPrompt(
          withTranslation,
          pdfType === "scanned",
        );
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${geminiKey}`;

        let parts;
        if (pdfType === "digital") {
          const ab = await file.arrayBuffer();
          const b64 = btoa(String.fromCharCode(...new Uint8Array(ab)));
          parts = [
            { inline_data: { mime_type: "application/pdf", data: b64 } },
            {
              text:
                prompt +
                "\n\nExtract all requirements from this TOR document. Return only the JSON array.",
            },
          ];
        } else {
          parts = [
            {
              text:
                prompt +
                `\n\nThe following is OCR text from a scanned TOR document:\n\n${ocrText}\n\nExtract all requirements. Return only the JSON array.`,
            },
          ];
        }

        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts }],
            generationConfig: { temperature: 0.1, maxOutputTokens: 8192 },
          }),
        });
        if (!res.ok) {
          const e = await res.json().catch(() => ({}));
          throw new Error(e?.error?.message || `Gemini API ${res.status}`);
        }
        const data = await res.json();
        const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
        const clean = raw.replace(/```json|```/g, "").trim();
        let parsed;
        try {
          parsed = JSON.parse(clean);
        } catch {
          throw new Error(
            "Could not parse Gemini response. Try again or check your API key.",
          );
        }
        if (!Array.isArray(parsed) || parsed.length === 0)
          throw new Error("No requirements found in Gemini response.");
        return parsed;
      }

      async function ocrPageWithGemini(
        pageB64,
        pageNum,
        geminiKey,
        geminiModel,
      ) {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${geminiKey}`;
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [
              {
                parts: [
                  { inline_data: { mime_type: "image/png", data: pageB64 } },
                  {
                    text: `This is page ${pageNum} of a scanned Thai TOR document. Extract ALL text exactly as written — verbatim Thai and English. Preserve numbering and paragraph structure. Return only the extracted text.`,
                  },
                ],
              },
            ],
            generationConfig: { temperature: 0, maxOutputTokens: 4096 },
          }),
        });
        if (!res.ok) {
          const e = await res.json().catch(() => ({}));
          throw new Error(
            e?.error?.message || `Gemini Vision API ${res.status}`,
          );
        }
        const data = await res.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
      }

      function validateAndMap(parsed, withTranslation) {
        return parsed.map((item, i) => {
          const ref = String(
            item.ref || `CL-${String(i + 1).padStart(3, "0")}`,
          );
          const req = String(item.requirement || "").trim();
          const tr = withTranslation
            ? String(item.translation || "").trim()
            : "";
          let cat = String(item.category || "Other");
          if (!VALID_CATS.includes(cat)) cat = "Other";
          const warn = req.length > 0 && isLikelyTranslated(req);
          return mkRow({
            ref,
            requirement: req,
            translation: tr,
            category: cat,
            status: "comply",
            remarks: "",
            _warn: warn,
          });
        });
      }

      function App() {

        });
